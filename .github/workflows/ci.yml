name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-smoke:
    name: Import smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Import package
        run: python -c "import comfyui_h3_context"

  quality:
    name: Supply and quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Validate acceptance baseline
        run: python scripts/acceptance_baseline.py validate
      - name: Reject pull-request policy relaxation
        if: github.event_name == 'pull_request'
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/acceptance_baseline.py compare --base-ref "$POLICY_BASE_SHA"
      - name: Reject policy relaxation on direct push
        if: github.event_name == 'push'
        env:
          POLICY_BASE_SHA: ${{ github.event.before }}
        run: python scripts/acceptance_baseline.py compare --base-ref "$POLICY_BASE_SHA"
      - name: Validate supply manifest
        run: python scripts/supply_chain_manifest.py --emit validate
      - name: Run pinned hooks once
        run: python -m pre_commit run --all-files --show-diff-on-failure

  backend:
    name: Backend tests and security
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev,host-tests]"
      # CPU tensors and owned-process monitoring are real test inputs, not optional mocks.
      - name: Install CPU perception test dependencies
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu
          python -m pip install --disable-pip-version-check Pillow==12.3.0 psutil==7.2.2
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.13.1"
      - name: Activate exact pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install exact frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      # CRITICAL: a populated private checkout cannot prove minimum-runtime public bootstrap.
      - name: Check public minimum-runtime contracts before the long suite
        run: python scripts/ci_preflight.py --public-minimum
      - name: Run backend tests with coverage
        run: python -m pytest --cov=comfyui_h3_context --cov-report=term-missing --cov-fail-under=75
      - name: Run offline security audit
        run: python scripts/security_audit.py

  frontend:
    name: Frontend check, unit and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.13.1"
      - name: Activate exact pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install exact dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Chromium for fixture integration tests
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run static checks
        run: pnpm --dir frontend run check
      - name: Run unit tests
        run: pnpm --dir frontend run test
      - name: Build deterministic bundle
        run: pnpm --dir frontend run build

  browser:
    name: Hermetic browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip
      - name: Prepare local fixture interpreter
        shell: bash
        run: |
          python -m venv .venv
          ${{ matrix.python }} -m pip install --disable-pip-version-check -e ".[dev,host-tests]"
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.13.1"
      - name: Activate exact pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install exact dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run hermetic browser lane
        shell: bash
        run: ${{ matrix.python }} scripts/browser_ci.py

  # The live supported-host suite remains an explicit compatibility/release lane and is not CI.
